name: Update sitemap
on:
  push:
    branches: [main]
    paths: ["**/index.html", "labs/**/data/**", "tools/seo/build_sitemap.py"]
  # Data commits made by other Actions don't trigger this, so also refresh lastmod daily.
  schedule:
    - cron: "40 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sitemap
  cancel-in-progress: false
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/seo/build_sitemap.py
      - name: Commit if changed
        run: |
          git diff --quiet sitemap.xml && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Update sitemap"
          git pull --rebase origin main
          git push
